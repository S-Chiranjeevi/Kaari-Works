services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artisanmart
      POSTGRES_USER: artisan
      POSTGRES_PASSWORD: artisan_dev_password
    ports:
      - "5432:5432"
    volumes:
      - artisanmart-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artisan -d artisanmart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artisanmart-postgres:

